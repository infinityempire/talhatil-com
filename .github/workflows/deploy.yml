name: 🚀 Deploy to talhatil.com (GitHub Pages)

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      reason:
        description: 'סיבת הפריסה הידנית'
        required: false
        default: 'Manual deploy'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy via GitHub Pages
    runs-on: ubuntu-latest

    steps:
      - name: ✅ Checkout code
        uses: actions/checkout@v4

      - name: 📋 Show deploy info
        run: |
          echo "🌐 Deploying to: talhatil.com"
          echo "📦 Branch: ${{ github.ref_name }}"
          echo "👤 Triggered by: ${{ github.actor }}"
          echo "📝 Commit: ${{ github.sha }}"
          echo "🕐 Time: $(date)"

      - name: 📂 Setup Pages
        uses: actions/configure-pages@v4

      - name: 📦 Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: 🚀 Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: ✅ Deploy complete
        run: |
          echo "✅ Deployment to talhatil.com completed successfully!"
          echo "🔗 https://talhatil.com"
