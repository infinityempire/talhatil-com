name: 🚀 Deploy to talhatil.com (Vercel)

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      reason:
        description: 'סיבת הפריסה הידנית'
        required: false
        default: 'Manual deploy'

jobs:
  deploy:
    name: Deploy via Vercel CLI
    runs-on: ubuntu-latest

    steps:
      - name: ✅ Checkout code
        uses: actions/checkout@v4

      - name: 📋 Show deploy info
        run: |
          echo "🌐 Deploying to: talhatil.com"
          echo "📦 Branch: ${{ github.ref_name }}"
          echo "👤 Triggered by: ${{ github.actor }}"
          echo "📝 Commit: ${{ github.sha }}"
          echo "🕐 Time: $(date)"

      - name: 📦 Install Vercel CLI
        run: npm install -g vercel@latest

      - name: 🚀 Deploy to Vercel (Production)
        run: |
          vercel deploy --prod --yes \
            --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: ✅ Deploy complete
        run: |
          echo "✅ Deployment to talhatil.com completed successfully!"
          echo "🔗 https://talhatil.com"
